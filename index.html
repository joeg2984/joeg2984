<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spartanburg Regional Virtual Information Desk</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <h1>Spartanburg Regional Virtual Information Desk</h1>
        <p>
          Modern patient navigation assistant with emergency guardrails,
          clickable recommendations, and sitemap-powered website search.
        </p>
      </header>
    </main>

    <button
      id="chat-widget-toggle"
      class="chat-widget-toggle"
      type="button"
      aria-controls="chat-widget-panel"
      aria-expanded="false"
    >
      💬 Help Desk
    </button>

    <section
      id="chat-widget-panel"
      class="chat-widget-panel"
      aria-label="Spartanburg Regional chat assistant"
      hidden
    >
      <header class="widget-header">
        <div>
          <h2>Virtual Information Desk</h2>
          <p id="assistant-status" class="assistant-status">Connecting website index…</p>
        </div>
        <button id="chat-widget-minimize" type="button" aria-label="Minimize chat">—</button>
      </header>

      <div id="chat-log" class="chat-log" aria-live="polite"></div>

      <div id="quick-actions" class="quick-actions" aria-label="Quick actions"></div>

      <form id="chat-form" class="chat-form">
        <label for="chat-input" class="sr-only">Ask a question</label>
        <input
          id="chat-input"
          name="chatInput"
          type="text"
          placeholder="Ask about appointments, urgent care, billing, locations…"
          required
        />
        <button type="submit">Send</button>
      </form>
    </section>

    <script src="chatbot.js"></script>
  </body>
</html>
